<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dr. Dano Dermatology — Recommended Skincare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=Inter+Tight:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F1ECE2;
    --card: #FBF8F1;
    --card-2: #F6F1E5;
    --ink: #261A11;
    --ink-soft: #5A4633;
    --ink-mute: #8A7461;
    --accent: #B8643E;
    --accent-deep: #8C4524;
    --sage: #6F8054;
    --line: #C9BFAF;
    --line-soft: #DDD3C2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter Tight', sans-serif;
    font-weight: 400;
    line-height: 1.55;
    font-size: 17px;
    -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(ellipse at top left, rgba(184,100,62,0.06), transparent 50%),
      radial-gradient(ellipse at bottom right, rgba(111,128,84,0.05), transparent 60%);
    min-height: 100vh;
  }
  .wrap { max-width: 1140px; margin: 0 auto; padding: 56px 24px 80px; position: relative; }

  /* ==== LANG TOGGLE ==== */
  .lang-toggle {
    position: absolute;
    top: 24px;
    right: 24px;
    display: flex;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 999px;
    padding: 4px;
    z-index: 10;
  }
  .lang-toggle button {
    background: none;
    border: 0;
    padding: 10px 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.12em;
    color: var(--ink-mute);
    cursor: pointer;
    border-radius: 999px;
    transition: all 0.2s;
    min-height: 44px;
  }
  .lang-toggle button.active { background: var(--ink); color: var(--bg); }
  .lang-toggle button:not(.active):hover { color: var(--accent-deep); }

  /* HEADER */
  header { text-align: center; padding: 32px 0 48px; border-bottom: 1px solid var(--line); margin-bottom: 56px; }
  .brand { font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent-deep); margin-bottom: 24px; display: inline-flex; align-items: center; gap: 14px; font-weight: 500; }
  .brand::before, .brand::after { content: ''; width: 32px; height: 1px; background: var(--accent-deep); display: inline-block; }
  h1 { font-family: 'Fraunces', serif; font-weight: 400; font-size: clamp(44px, 7vw, 76px); line-height: 0.98; letter-spacing: -0.02em; margin-bottom: 24px; }
  h1 em { font-style: italic; font-weight: 300; color: var(--accent); }
  .lead { font-family: 'Fraunces', serif; font-style: italic; font-weight: 300; font-size: clamp(19px, 2.2vw, 23px); color: var(--ink-soft); max-width: 620px; margin: 0 auto 36px; line-height: 1.5; }
  .cta-quiz {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--ink);
    color: var(--bg);
    border: 0;
    padding: 18px 36px;
    font-family: 'Inter Tight', sans-serif;
    font-size: 17px;
    font-weight: 500;
    letter-spacing: 0.02em;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.2s;
    min-height: 56px;
  }
  .cta-quiz:hover { background: var(--accent-deep); transform: translateY(-1px); }

  /* ==== QUIZ ==== */
  .quiz-section { margin-bottom: 80px; scroll-margin-top: 20px; }
  .quiz-card {
    background: linear-gradient(135deg, #FBF8F1 0%, #F6F1E5 100%);
    border: 1.5px solid var(--line);
    border-radius: 8px;
    padding: 56px 48px;
    box-shadow: 0 1px 0 rgba(38,26,17,0.02), 0 20px 50px -24px rgba(38,26,17,0.14);
    position: relative;
    overflow: hidden;
  }
  .quiz-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 4px;
    background: linear-gradient(90deg, var(--accent), var(--sage), var(--accent));
  }
  .quiz-eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--accent); margin-bottom: 16px; text-align: center; font-weight: 500; }
  .quiz-title { font-family: 'Fraunces', serif; font-weight: 400; font-size: clamp(32px, 4.5vw, 44px); line-height: 1.1; text-align: center; margin-bottom: 16px; letter-spacing: -0.01em; }
  .quiz-sub { text-align: center; color: var(--ink-soft); font-size: 17px; max-width: 520px; margin: 0 auto 40px; line-height: 1.55; }
  .quiz-progress { display: flex; justify-content: center; gap: 10px; margin-bottom: 40px; }
  .quiz-progress .dot { width: 48px; height: 5px; background: var(--line); border-radius: 3px; transition: background 0.3s; }
  .quiz-progress .dot.active { background: var(--accent); }
  .quiz-progress .dot.done { background: var(--sage); }
  .quiz-question { display: none; max-width: 700px; margin: 0 auto; }
  .quiz-question.active { display: block; }
  .quiz-question h3 { font-family: 'Fraunces', serif; font-weight: 400; font-size: clamp(24px, 3vw, 30px); text-align: center; margin-bottom: 36px; line-height: 1.25; letter-spacing: -0.005em; color: var(--ink); }
  .options-list { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
  .option-card {
    background: #fff;
    border: 2px solid var(--line);
    padding: 22px 24px;
    text-align: left;
    cursor: pointer;
    transition: all 0.18s;
    font-family: 'Inter Tight', sans-serif;
    border-radius: 8px;
    min-height: 88px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    color: var(--ink);
  }
  .option-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 24px -12px rgba(184,100,62,0.25); }
  .option-card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .option-card.selected { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .option-card .opt-label { font-size: 19px; font-weight: 500; margin-bottom: 6px; display: block; letter-spacing: -0.005em; }
  .option-card .opt-desc { font-size: 15px; color: var(--ink-soft); line-height: 1.45; }
  .option-card.selected .opt-desc { color: rgba(241, 236, 226, 0.78); }
  .not-sure-row { display: flex; justify-content: center; margin-bottom: 32px; }
  .not-sure-btn {
    background: transparent;
    border: 1.5px dashed var(--line);
    padding: 14px 24px;
    font-family: 'Inter Tight', sans-serif;
    font-size: 15px;
    color: var(--ink-soft);
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.2s;
    min-height: 48px;
  }
  .not-sure-btn:hover { border-color: var(--accent); color: var(--accent-deep); border-style: solid; }
  .not-sure-btn.selected { background: var(--sage); color: #fff; border-color: var(--sage); border-style: solid; }
  .quiz-nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 16px; }
  .nav-btn {
    background: none;
    border: 1.5px solid var(--line);
    padding: 14px 28px;
    font-family: 'Inter Tight', sans-serif;
    font-size: 15px;
    font-weight: 500;
    color: var(--ink-soft);
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.2s;
    min-height: 52px;
  }
  .nav-btn:hover { color: var(--accent-deep); border-color: var(--accent); }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .nav-btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); padding: 14px 32px; }
  .nav-btn.primary:hover:not(:disabled) { background: var(--accent-deep); border-color: var(--accent-deep); }

  /* RESULTS */
  .quiz-results { display: none; }
  .quiz-results.active { display: block; }
  .results-header { text-align: center; margin-bottom: 40px; }
  .results-header h3 { font-family: 'Fraunces', serif; font-weight: 400; font-size: clamp(30px, 4vw, 40px); margin-bottom: 10px; letter-spacing: -0.01em; }
  .results-header .summary { font-family: 'Fraunces', serif; font-style: italic; font-weight: 300; color: var(--ink-soft); font-size: 18px; }
  .routine-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 28px; }
  .routine-block { background: #fff; border: 1.5px solid var(--line); border-radius: 6px; padding: 28px 26px; }
  .routine-block.extras { grid-column: 1 / -1; background: var(--card-2); }
  .routine-block-header { display: flex; align-items: center; gap: 12px; padding-bottom: 18px; border-bottom: 1px solid var(--line-soft); margin-bottom: 20px; }
  .routine-icon { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: var(--bg); border-radius: 50%; font-size: 18px; }
  .routine-block-title { font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink); font-weight: 500; }
  .routine-step { display: flex; align-items: flex-start; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--line-soft); }
  .routine-step:last-child { border-bottom: 0; padding-bottom: 0; }
  .step-num { flex-shrink: 0; width: 32px; height: 32px; background: var(--ink); color: var(--bg); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; }
  .step-info { flex: 1; min-width: 0; }
  .step-brand { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; font-weight: 500; }
  .step-name { font-family: 'Fraunces', serif; font-size: 17px; line-height: 1.3; color: var(--ink); margin-bottom: 4px; }
  .step-use { font-size: 14px; color: var(--ink-soft); line-height: 1.5; }
  .tips { background: var(--card); border: 1.5px solid var(--line); border-left: 4px solid var(--sage); border-radius: 6px; padding: 22px 26px; margin-bottom: 28px; }
  .tips-label { font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--sage); margin-bottom: 12px; font-weight: 500; }
  .tips ul { list-style: none; }
  .tips li { font-size: 15px; color: var(--ink-soft); line-height: 1.55; padding: 6px 0; }
  .tips li::before { content: '— '; color: var(--sage); font-weight: 500; }
  .results-actions { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }

  /* NAV */
  .catnav { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-bottom: 56px; }
  .catnav a { font-family: 'Inter Tight', sans-serif; font-size: 14px; font-weight: 500; letter-spacing: 0.04em; color: var(--ink-soft); text-decoration: none; padding: 12px 22px; border: 1.5px solid var(--line); border-radius: 999px; background: var(--card); transition: all 0.2s; min-height: 44px; display: flex; align-items: center; }
  .catnav a:hover { color: var(--accent-deep); border-color: var(--accent); background: #fff; }

  /* CATEGORY */
  section.category { margin-bottom: 96px; }
  .cat-header { display: flex; align-items: baseline; gap: 20px; margin-bottom: 36px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
  .cat-num { font-family: 'Fraunces', serif; font-style: italic; font-weight: 300; font-size: 30px; color: var(--ink-mute); }
  .cat-title { font-family: 'Fraunces', serif; font-weight: 400; font-size: clamp(30px, 4vw, 42px); line-height: 1; letter-spacing: -0.01em; flex: 1; }
  .cat-count { font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-mute); }
  .cat-desc { font-size: 16px; color: var(--ink-soft); margin-bottom: 36px; max-width: 680px; line-height: 1.6; }

  /* PRODUCTS */
  .products { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .product { background: var(--card); border: 1.5px solid var(--line); border-radius: 6px; display: flex; flex-direction: column; overflow: hidden; transition: transform 0.3s, box-shadow 0.3s; box-shadow: 0 1px 0 rgba(38,26,17,0.02), 0 8px 24px -16px rgba(38,26,17,0.08); }
  .product:hover { transform: translateY(-2px); box-shadow: 0 1px 0 rgba(38,26,17,0.04), 0 16px 36px -16px rgba(38,26,17,0.14); }
  .product-image { aspect-ratio: 4/3; background: var(--card-2); background-image: radial-gradient(ellipse at 30% 30%, rgba(255,255,255,0.8), transparent 60%), radial-gradient(ellipse at 70% 80%, rgba(184,100,62,0.08), transparent 60%); display: flex; align-items: center; justify-content: center; border-bottom: 1px solid var(--line-soft); position: relative; overflow: hidden; }
  .product-image img { width: 100%; height: 100%; object-fit: contain; padding: 16px; }
  .product-image .ph-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .product-image svg.ph { width: 60%; max-width: 130px; height: auto; }
  .product-image .ph-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-mute); }
  .product-info { padding: 24px 24px 26px; flex-grow: 1; display: flex; flex-direction: column; }
  .product-brand { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; font-weight: 500; }
  .product-name { font-family: 'Fraunces', serif; font-weight: 400; font-size: 22px; line-height: 1.2; letter-spacing: -0.005em; margin-bottom: 14px; color: var(--ink); }
  .product-use { font-size: 15px; color: var(--ink-soft); line-height: 1.55; flex-grow: 1; }

  /* FOOTER */
  footer { margin-top: 64px; padding-top: 40px; border-top: 1px solid var(--line); text-align: center; }
  .ornament { color: var(--accent); letter-spacing: 0.4em; margin-bottom: 16px; }
  footer p { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-mute); line-height: 1.8; font-weight: 500; }
  footer strong { color: var(--ink-soft); font-weight: 500; }
  .disclaimer { margin-top: 24px; font-family: 'Fraunces', serif; font-style: italic; font-weight: 300; font-size: 15px; color: var(--ink-mute); max-width: 580px; margin-left: auto; margin-right: auto; line-height: 1.55; letter-spacing: 0; text-transform: none; }

  /* RESPONSIVE */
  @media (max-width: 880px) { .products { grid-template-columns: repeat(2, 1fr); } .routine-grid { grid-template-columns: 1fr; } .quiz-card { padding: 40px 28px; } }
  @media (max-width: 600px) {
    body { font-size: 16px; }
    .wrap { padding: 36px 18px 56px; }
    .products { grid-template-columns: 1fr; gap: 20px; }
    .options-list { grid-template-columns: 1fr; }
    .catnav { margin-bottom: 48px; }
    section.category { margin-bottom: 72px; }
    .product-image { aspect-ratio: 16/10; }
    .quiz-card { padding: 32px 22px; }
    .lang-toggle { top: 18px; right: 18px; }
    .lang-toggle button { padding: 8px 16px; font-size: 13px; }
    .quiz-nav { flex-direction: column-reverse; align-items: stretch; }
    .quiz-nav .nav-btn { width: 100%; }
  }

  /* PRINT (just the routine) */
  @media print {
    body { background: #fff; font-size: 14px; }
    .lang-toggle, .cta-quiz, header .brand, header h1, .lead, .catnav, section.category, footer, .quiz-progress, .results-actions, .quiz-question { display: none !important; }
    .quiz-card { border: none; box-shadow: none; padding: 0; background: none; }
    .quiz-card::before { display: none; }
    .quiz-section { margin: 0; }
    .quiz-results.active { display: block !important; }
    .routine-block { break-inside: avoid; border-color: #999; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="lang-toggle" role="group" aria-label="Language">
    <button data-lang="en" class="active" type="button">EN</button>
    <button data-lang="es" type="button">ES</button>
  </div>

  <header>
    <div class="brand">Dr. Dano Dermatology</div>
    <h1 id="t-headline"></h1>
    <p class="lead" id="t-lead"></p>
    <button class="cta-quiz" id="cta-quiz" type="button"></button>
  </header>

  <section class="quiz-section" id="quiz">
    <div class="quiz-card">
      <div id="quiz-intro">
        <div class="quiz-eyebrow" id="t-quiz-eyebrow"></div>
        <h2 class="quiz-title" id="t-quiz-title"></h2>
        <p class="quiz-sub" id="t-quiz-sub"></p>

        <div class="quiz-progress" id="quiz-progress">
          <span class="dot active"></span>
          <span class="dot"></span>
        </div>

        <div class="quiz-question active" data-question="0">
          <h3 id="t-q1"></h3>
          <div class="options-list" id="opts-skintype"></div>
          <div class="not-sure-row">
            <button class="not-sure-btn" id="btn-not-sure" type="button"></button>
          </div>
          <div class="quiz-nav">
            <span></span>
            <button class="nav-btn primary" id="btn-next-1" disabled type="button"></button>
          </div>
        </div>

        <div class="quiz-question" data-question="1">
          <h3 id="t-q2"></h3>
          <div class="options-list" id="opts-concern"></div>
          <div class="quiz-nav">
            <button class="nav-btn" id="btn-back-2" type="button"></button>
            <button class="nav-btn primary" id="btn-submit" disabled type="button"></button>
          </div>
        </div>
      </div>

      <div class="quiz-results" id="quiz-results">
        <div class="results-header">
          <h3 id="t-results-title"></h3>
          <p class="summary" id="results-summary"></p>
        </div>
        <div class="routine-grid" id="routine-grid"></div>
        <div class="tips" id="tips-box" hidden>
          <div class="tips-label" id="t-tips-label"></div>
          <ul id="tips-list"></ul>
        </div>
        <div class="results-actions">
          <button class="nav-btn" id="btn-restart" type="button"></button>
          <button class="nav-btn primary" id="btn-print" type="button"></button>
        </div>
      </div>
    </div>
  </section>

  <nav class="catnav" id="catnav"></nav>
  <main id="main"></main>

  <footer>
    <div class="ornament">· · ·</div>
    <p>
      <strong id="t-footer-brand">Dr. Dano Dermatology</strong><br>
      <span id="t-footer-meta"></span>
    </p>
    <p class="disclaimer" id="t-disclaimer"></p>
  </footer>

</div>

function buildRoutine({ skinType, concern, notSure }) {
  const am = ['cerave-cleanser'];
  const pm = ['cerave-cleanser'];
  const extras = [];
  const tips = [];

  const moisturizer = concern === 'dryness' ? 'cerave-itch-relief' : 'vanicream';

  let amSpf;
  if (skinType === 'sensitive' || notSure) {
    amSpf = 'olay-spf30'; // 2-in-1 → fewer steps to remember
  } else if (concern === 'sun' || skinType === 'oily' || skinType === 'combination') {
    amSpf = 'eltamd';
  } else {
    amSpf = 'eltamd';
  }

  if (amSpf !== 'olay-spf30') am.push(moisturizer);
  am.push(amSpf);

  const safeForRetinol = skinType !== 'sensitive' && concern !== 'dryness' && !notSure;
  if (concern === 'aging' && safeForRetinol) {
    pm.push('gold-bond-retinol');
    if (skinType === 'dry') pm.push(moisturizer);
    tips.push('tipRetinol');
  } else if (concern === 'dryness') {
    pm.push('cerave-itch-relief');
    tips.push('tipDryness');
  } else {
    pm.push(moisturizer);
    if (skinType === 'dry') tips.push('tipDryness');
  }

  if (concern === 'hair') {
    extras.push('rogaine');
    tips.push('tipRogaine');
  }
  if (skinType === 'sensitive') tips.push('tipSensitive');
  if (notSure) tips.push('tipNotSure');

  return { am, pm, extras, tips };
}

  const effective = answers.notSure ? 'sensitive' : answers.skinType;
  lastRoutine = buildRoutine({ skinType: effective, concern: answers.concern, notSure: answers.notSure });
  $('quiz-intro').style.display = 'none';
  $('quiz-results').classList.add('active');
  renderResults();
  $('quiz').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function restartQuiz() {
  answers.skinType = null;
  answers.concern = null;
  answers.notSure = false;
  lastRoutine = null;
  $('quiz-intro').style.display = 'block';
  $('quiz-results').classList.remove('active');
  $('btn-next-1').disabled = true;
  $('btn-submit').disabled = true;
  $('btn-not-sure').classList.remove('selected');
  renderOptions();
  showStep(0);
}

// ===================================================================
// EVENT WIRE-UP
// ===================================================================
$('btn-next-1').addEventListener('click', () => showStep(1));
$('btn-back-2').addEventListener('click', () => showStep(0));
$('btn-submit').addEventListener('click', submitQuiz);
$('btn-restart').addEventListener('click', restartQuiz);
$('btn-print').addEventListener('click', () => window.print());
$('cta-quiz').addEventListener('click', () => $('quiz').scrollIntoView({ behavior: 'smooth', block: 'start' }));

$('btn-not-sure').addEventListener('click', e => {
  answers.notSure = true;
  answers.skinType = 'sensitive';
  document.querySelectorAll('#opts-skintype .option-card').forEach(b => b.classList.remove('selected'));
  e.currentTarget.classList.add('selected');
  $('btn-next-1').disabled = false;
});

document.querySelectorAll('.lang-toggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    if (currentLang === btn.dataset.lang) return;
    currentLang = btn.dataset.lang;
    document.querySelectorAll('.lang-toggle button').forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));
    applyTranslations();
  });
});

applyTranslations();
</script>
</body>
</html>
